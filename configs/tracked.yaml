# Configurations we actually serve, measured through llama-server.
#
# These are the opposite of canaries. A canary is a probe of kernel dispatch that
# nobody runs; these are the real operating points, at real context lengths, with
# speculative decoding on. llama-bench cannot measure them at all -- it has no
# spec-decode flags -- which is why the stage-1 harness could only ever produce
# canary rows and why every `spec` row in the ledger before 2026-08-16 was scraped
# from a log rather than measured.
#
# Measured via `harness/bench_server.sh`, which needs PERF_LAB_SERVER_BIN pointing
# at a working llama-server. Note that this is NOT the same build as PERF_LAB_BIN:
# the local GCC 15 build's llama-server segfaults on any model, so the official
# ROCm prebuilt is used here. fp.build.binary_sha256 records which one produced a
# row, since both report upstream fb0e6b621.
#
# Prompt text is never committed -- this repo is public. It comes from
# $PERF_LAB_PROMPT and each row cites its sha256 in ok.corpus_sha.

defaults:
  n_gen: 256
  threads: 8
  ngl: 99
  fa: "on"
  reps: 3

tracked:
  baseline:
    ctx: 262144
    ctk: q4_0
    ctv: q4_0
    spec: draft-mtp
    n_max: 4
    n_predict: 256
    role: baseline
    note: >
      The shipped config. 46.15 tok/s decode at 0.7708 acceptance when it was found
      by hand on 2026-08-15 (run r-3e958f9f, backfilled), against a 21.80 tok/s
      unspeculated baseline. Everything else here is judged against this.

  no-spec:
    ctx: 262144
    ctk: q4_0
    ctv: q4_0
    spec: null
    n_max: null
    n_predict: 256
    role: candidate
    note: >
      Speculation off. The reference point that says what speculative decoding is
      actually buying, and the config every spec variant must be token-identical to.

  mtp-n2:
    ctx: 262144
    ctk: q4_0
    ctv: q4_0
    spec: draft-mtp
    n_max: 2
    n_predict: 256
    role: candidate
    note: Shallower draft. Cheaper per step, lower acceptance ceiling.

  kv-q8:
    ctx: 262144
    ctk: q8_0
    ctv: q8_0
    spec: draft-mtp
    n_max: 4
    n_predict: 256
    role: candidate
    note: >
      The other supported KV type, matched pair. Lossy relative to nothing --
      it is q4_0 that is the aggressive choice -- so this is the reference the
      shipped config's quality is judged against. Costs roughly twice the KV
      memory, which at 262K is what made q4_0 attractive in the first place.
      Never sweep between this and q4_0 on speed alone: they do not produce the
      same answers, and the divergence is not a tie-break.

  mtp-n6:
    ctx: 262144
    ctk: q4_0
    ctv: q4_0
    spec: draft-mtp
    n_max: 6
    n_predict: 256
    role: candidate
    note: >
      Deeper draft. Backfilled data says acceptance collapses past n=4 (0.5000 at
      n_max 6, run r-ea640b54); this is the measurement that confirms it on the
      current stack rather than trusting a log from another day.

  kv-mixed:
    ctx: 262144
    ctk: q8_0
    ctv: q4_0
    spec: draft-mtp
    n_max: 4
    n_predict: 256
    role: candidate
    note: >
      q8_0 K with q4_0 V. On ROCm this is the mismatched-pair trap -- prefill
      collapses ~7.8x while decode looks normal -- which is why it was never a
      candidate before. On the b10472 Vulkan build there is no fallback cliff, so
      it becomes the fastest option measured (50.9-53.3 t/s decode with MTP). It
      buys K precision over the shipped q4_0/q4_0 at the cost of VRAM: 33.6 of
      34.2 GB at ctx 262144, leaving no headroom for a second process.
