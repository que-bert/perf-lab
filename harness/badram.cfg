# GRUB drop-in: install to /etc/default/grub.d/badram.cfg, then sudo update-grub.
# Reserves the 4 KiB pages memtest86+ flagged on 2026-09-29 (bit 58, both directions):
#   0x3dde30360, 0x3dde306a0 -> page 0x3dde30000 (failed at DDR4-3600 and DDR4-3200)
#   0x3df385ba0              -> page 0x3df385000 (failed once, at DDR4-3600)
# The triple backslash survives grub-mkconfig as memmap=4K$0x...
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT memmap=4K\\\$0x3dde30000 memmap=4K\\\$0x3df385000"
